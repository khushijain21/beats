# Client krb5.conf for Kafka GSSAPI against the cloud Active Directory DC.
# Domain: ingest.example.com (realm INGEST.EXAMPLE.COM)
# KDC:   [VM-IP] (GCP public IP of khushi-ad-windows-server)

[libdefaults]
    default_realm = INGEST.EXAMPLE.COM
    dns_canonicalize_hostname = false
    dns_lookup_kdc = false
    dns_lookup_realm = false
    dns_uri_lookup = false
    forwardable = true
    ignore_acceptor_hostname = true
    rdns = false
    # AD commonly offers these etypes; include AES and RC4 for compatibility.
    default_tgs_enctypes = aes256-cts-hmac-sha1-96 aes128-cts-hmac-sha1-96 rc4-hmac
    default_tkt_enctypes = aes256-cts-hmac-sha1-96 aes128-cts-hmac-sha1-96 rc4-hmac
    permitted_enctypes = aes256-cts-hmac-sha1-96 aes128-cts-hmac-sha1-96 rc4-hmac
    udp_preference_limit = 1
    kdc_timeout = 3000

[realms]
    INGEST.EXAMPLE.COM = {
        kdc = [VM-IP]
        admin_server = [VM-IP]
        default_domain = ingest.example.com
    }

[domain_realm]
    .ingest.example.com = INGEST.EXAMPLE.COM
    ingest.example.com = INGEST.EXAMPLE.COM
